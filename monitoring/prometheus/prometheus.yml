global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-gateway:8000"]
        labels:
          tier: "gateway"

  - job_name: "frontend-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["frontend-service:8080"]
        labels:
          tier: "presentation"

  - job_name: "backend-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend-worker:8001"]
        labels:
          tier: "worker"

  - job_name: "data-cache-store"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["data-cache-store:8002"]
        labels:
          tier: "cache"

  - job_name: "cadvisor"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          tier: "infrastructure"
